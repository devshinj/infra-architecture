# PR 과 main push 마다: lint · 단위 · 빌드 · 타입 · 통합 테스트, 그리고 운영 Docker 이미지가 빌드되는지.
# E2E 는 느려서 넣지 않았다(npm run test:e2e 로 직접 돌린다).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: infrasketch_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # 통합 테스트는 이 서버에 폴더 이름을 붙인 _test DB 를 만들어 쓴다(tests/test-db.ts).
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5433/infrasketch_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: lint
        run: npm run lint
      - name: 단위 테스트
        run: npm test
      # 빌드가 next-env.d.ts 와 .next/types 를 만든다. 타입 검사는 그 뒤에.
      - name: 빌드
        run: npx next build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:1/build
          AUTH_SECRET: ci-build-only-not-a-secret-000000000000
      - name: 타입 검사
        run: npx tsc --noEmit --incremental false
      - name: 통합 테스트
        run: npm run test:int

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 운영 이미지 빌드(올리지 않는다)
        run: docker build --target runner -t infrasketch-app:ci .
      - name: 도구 이미지 빌드
        run: docker build --target tools -t infrasketch-tools:ci .
