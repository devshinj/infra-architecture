services:
  db:
    image: postgres:16
    container_name: infrasketch-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: infrasketch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: infrasketch-db-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: infrasketch_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  db_data:
