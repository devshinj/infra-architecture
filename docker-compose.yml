# 개발용. 비밀번호가 고정이라 이 컴퓨터에서만 붙을 수 있게 127.0.0.1 에만 연다(운영 DB 로 쓰지 않는다).
services:
  db:
    image: postgres:16
    container_name: infrasketch-db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: infrasketch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  db_test:
    image: postgres:16
    container_name: infrasketch-db-test
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: infrasketch_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  db_data:
